<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f0e4">
  <title>A Story for You</title>

  <!-- Fonts: swap for local files in assets/fonts/ later if you want it fully offline -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Caveat:wght@400;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body data-scene="">

  <!-- Soft floating dust / particles, shared by all scenes -->
  <canvas id="fx" aria-hidden="true"></canvas>

  <main id="story">

    <!-- SCENE 1: Two People, One Story. She drags the two characters together.
         The drawing is built by js/opening.js; the words come from js/content.js -->
    <section class="scene" id="scene-opening" data-scene="opening" inert aria-hidden="true">
      <div class="stage opening" id="opening">
        <p class="eyebrow reveal" id="open-eyebrow" style="--i:0"></p>
        <h1 class="title reveal" id="open-title" style="--i:2"></h1>

        <div class="opening-art reveal" id="opening-art" style="--i:4"></div>

        <div class="opening-foot reveal" style="--i:7">
          <div class="opening-hint" id="open-hint">
            <p class="hand" id="open-hint-text"></p>
            <p class="eyebrow" id="open-hint-sub"></p>
          </div>
          <div class="opening-after" id="open-after">
            <p class="eyebrow" id="open-date"></p>
            <p class="memory-caption" id="open-line"></p>
            <button class="btn" id="open-continue" data-next></button>
          </div>
        </div>
      </div>
    </section>

    <!-- SCENE 2: The Flower Comes to Life. The bouquet is painted by js/flower.js -->
    <section class="scene" id="scene-flower" data-scene="flower" inert aria-hidden="true">
      <canvas id="flower-canvas" class="flower-canvas" aria-hidden="true"></canvas>
      <div class="stage flower-stage">
        <div class="flower-foot" id="flower-foot">
          <p class="hand" id="flower-caption"></p>
          <p class="eyebrow" id="flower-sub"></p>
          <button class="btn" id="flower-continue" data-next></button>
        </div>
      </div>
    </section>

    <!-- SCENE 3: Our Memories (photos, dates and captions come from js/content.js) -->
    <section class="scene" id="scene-memories" data-scene="memories" inert aria-hidden="true">
      <div class="stage memories">
        <p class="eyebrow" id="memory-heading"></p>

        <!-- memories.js builds one slide per photo inside here -->
        <div class="slides" id="slides" role="group" aria-roledescription="slideshow" aria-label="Our memories"></div>

        <div class="memory-text" id="memory-text" aria-live="polite">
          <p class="memory-date" id="memory-date"></p>
          <p class="memory-caption" id="memory-caption"></p>
        </div>

        <div class="memory-nav">
          <button class="nav-btn" id="memory-prev" aria-label="Previous photo">&#8249;</button>
          <div class="memory-progress">
            <div class="progress-track"><div class="progress-fill" id="memory-fill"></div></div>
            <span class="progress-count" id="memory-count"></span>
          </div>
          <button class="nav-btn" id="memory-next" aria-label="Next photo"><span class="nav-label" id="memory-next-label"></span><span aria-hidden="true">&#8250;</span></button>
        </div>
      </div>
    </section>

    <!-- SCENE 4: Happy Birthday (text comes from js/content.js) -->
    <section class="scene" id="scene-birthday" data-scene="birthday" inert aria-hidden="true">
      <div class="stage">
        <p class="eyebrow reveal" id="greet-eyebrow" style="--i:0"></p>
        <h2 class="title title--big reveal" id="greet-title" style="--i:2"></h2>
        <p class="subtitle reveal" id="greet-subtitle" style="--i:5"></p>
        <button class="btn reveal" id="greet-button" style="--i:8" data-next></button>
      </div>
    </section>

    <!-- SCENE 5: The Letter (text comes from js/content.js) -->
    <section class="scene" id="scene-letter" data-scene="letter" inert aria-hidden="true">
      <div class="stage">
        <article class="letter" id="letter" tabindex="0" aria-label="Birthday letter"></article>
        <button class="btn" data-next>Continue</button>
      </div>
    </section>

    <!-- SCENE 6: Closing (text comes from js/content.js) -->
    <section class="scene" id="scene-closing" data-scene="closing" inert aria-hidden="true">
      <div class="stage closing">
        <div class="closing-thanks" id="closing-thanks"></div>
        <div class="closing-end" id="closing-end">
          <figure class="print"><img id="closing-photo" alt="The two of us" decoding="async"></figure>
          <p class="closing-line" id="closing-final"></p>
          <button class="btn btn--quiet" id="closing-replay" data-replay></button>
        </div>
      </div>
    </section>

  </main>

  <!-- Music: put your song file at  assets/music/risk-it-all.mp3  (same name as data-src below).
       Until that file exists, the music button simply stays hidden. -->
  <audio id="music" loop preload="none" data-src="assets/music/risk-it-all.mp3"></audio>
  <button id="music-toggle" class="music-toggle" aria-label="Toggle music" hidden>♪</button>

  <!-- Order matters: helpers first, scenes next, main.js last -->
  <script src="js/effects.js"></script>
  <script src="js/content.js"></script>
  <script src="js/opening.js"></script>
  <script src="js/flower.js"></script>
  <script src="js/memories.js"></script>
  <script src="js/birthday.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
